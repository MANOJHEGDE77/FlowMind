services:
  postgres:
    image: postgres:16-alpine
    container_name: flowmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowmind
      POSTGRES_PASSWORD: flowmind_secret
      POSTGRES_DB: flowmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowmind -d flowmind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowmind-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://flowmind:flowmind_secret@postgres:5432/flowmind_db
      - SECRET_KEY=flowmind-super-secure-production-secret-key-change-in-prod-2026
      - ENV=production
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowmind-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
